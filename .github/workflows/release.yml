name: Release Assets

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version label for artifacts when no release tag is present'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive GitHub package scope
        run: echo "GITHUB_PACKAGE_SCOPE=@${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Configure package.json for GitHub Packages
        run: |
          npm pkg set name="${GITHUB_PACKAGE_SCOPE}/mcp-mindbody"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive container tags
        run: |
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "IMAGE_VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "IMAGE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_VERSION=manual" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/mcp-mindbody:latest
            ghcr.io/${{ env.GHCR_OWNER }}/mcp-mindbody:${{ env.IMAGE_VERSION }}
